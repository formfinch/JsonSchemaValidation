name: PR CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'backlog/**'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-test:
    name: Build, Test & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test JsonSchemaValidationTests/JsonSchemaValidationTests.csproj --no-build -c Release --settings JsonSchemaValidationTests/default.runsettings --logger "trx;LogFileName=test-results.trx"

      # Code generation tests (C#, JS via Jint, TS via tsc + Jint). The TS tests need tsc and
      # fail without it. TypeScriptCompiler passes --ignoreDeprecations 6.0, so pin TypeScript 6.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: |
          npm install -g typescript@6.0.3
          tsc --version

      - name: Test code generation
        run: dotnet test JsonSchemaValidation.CodeGenerator.Tests/JsonSchemaValidation.CodeGenerator.Tests.csproj --no-build -c Release --logger "trx;LogFileName=codegen-test-results.trx"

      - name: Pack
        run: dotnet pack JsonSchemaValidation/JsonSchemaValidation.csproj --no-build -c Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*test-results.trx'
          retention-days: 7
